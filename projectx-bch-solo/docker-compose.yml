version: "3.8"

# ──────────────────────────────────────────────────────────────────────────────
# Project X connects to the Bitcoin Cash Node app already running on Umbrel.
# Umbrel's BCH node container is reachable at hostname:
#   bitcoin-cash-node_node_1   (port 8332)
# on the external Docker network: bitcoin-cash-node_default
#
# RPC credentials must match what is set in the BCH Node app on Umbrel.
# By default Umbrel uses: user=umbrel  pass=moneyprintergobrrr
# You can confirm them in: ~/umbrel/app-data/bitcoin-cash-node/data/bitcoin.conf
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ──────────────────────────────────────────────
  # nginx — static UI + API reverse proxy
  # ──────────────────────────────────────────────
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./exports/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./exports/app:/usr/share/nginx/html:ro
    networks:
      - default
    depends_on:
      - api

  # ──────────────────────────────────────────────
  # ckpool solo stratum server
  # Points at the existing Umbrel BCH node — no
  # second node is started.
  # ──────────────────────────────────────────────
  ckpool:
    image: ghcr.io/getumbrel/docker-ckpool-solo:590fb2a
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - ckpool_data:/data
      - ./scripts/init.sh:/scripts/init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    networks:
      - default
      - bchn_network   # reach the existing Umbrel BCH node

  # ──────────────────────────────────────────────
  # Python Flask API — reads ckpool log + proxies
  # BCH node RPC for dashboard status data.
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ckpool_data:/data
    environment:
      # Umbrel BCH Node hostname on its internal Docker network
      - BCH_RPC_HOST=bitcoin-cash-node_node_1
      - BCH_RPC_PORT=8332
      # Default Umbrel BCH node RPC credentials — change if yours differ
      - BCH_RPC_USER=umbrel
      - BCH_RPC_PASS=moneyprintergobrrr
      - SETTINGS_FILE=/data/projectx-settings.json
      - LOG_FILE=/data/ckpool.log
    networks:
      - default
      - bchn_network   # reach the existing Umbrel BCH node
    depends_on:
      - ckpool

volumes:
  ckpool_data:

networks:
  default:
  # The external network created by the Umbrel Bitcoin Cash Node app.
  # Name format: <app-id>_default  →  bitcoin-cash-node_default
  bchn_network:
    external: true
    name: bitcoin-cash-node_default
