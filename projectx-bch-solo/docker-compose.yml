version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: projectx-bch-solo_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    stop_grace_period: 1m

  bchnd:
    image: zquestz/bitcoin-cash-node:28.0.1
    restart: on-failure
    stop_grace_period: 15m
    command: >
      bitcoind
      -datadir=/data
      -rpcuser=bchrpc
      -rpcpassword=changeme_rpc
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0
      -rpcport=8332
      -server=1
      -txindex=1
      -addnode=seed.flowee.cash
    volumes:
      - ${APP_DATA_DIR}/data/bchnd:/data
    networks:
      - umbrel_main_network

  ckpool:
    image: ghcr.io/getumbrel/docker-ckpool-solo:590fb2a
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3333:3333/tcp"
    depends_on:
      - bchnd
