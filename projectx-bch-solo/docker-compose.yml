version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: web
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
    networks:
      - umbrel_main_network

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/exports/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/exports/app:/usr/share/nginx/html:ro
    networks:
      - umbrel_main_network
    depends_on:
      - api

  bchnd:
    image: zquestz/bitcoin-cash-node:28.0.1
    restart: on-failure
    command: >
      bitcoind
      -datadir=/data
      -rpcuser=bchrpc
      -rpcpassword=changeme_rpc
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0
      -rpcport=8332
      -server=1
      -txindex=1
    volumes:
      - ${APP_DATA_DIR}/data/bchnd:/data
    networks:
      - umbrel_main_network

  ckpool:
    image: ghcr.io/getumbrel/docker-ckpool-solo:590fb2a
    restart: on-failure
    ports:
      - "3333:3333"
    volumes:
      - ${APP_DATA_DIR}/data/ckpool:/data
      - ${APP_DATA_DIR}/scripts/init.sh:/scripts/init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    networks:
      - umbrel_main_network
    depends_on:
      - bchnd

  api:
    image: python:3.12-slim
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/ckpool:/data
      - ${APP_DATA_DIR}/api:/app
    working_dir: /app
    command: >
      sh -c "pip install flask gunicorn requests --quiet &&
             gunicorn -w 2 -b 0.0.0.0:3000 app:app"
    environment:
      - BCH_RPC_HOST=bchnd
      - BCH_RPC_PORT=8332
      - SETTINGS_FILE=/data/projectx-settings.json
      - LOG_FILE=/data/ckpool.log
    networks:
      - umbrel_main_network
    depends_on:
      - bchnd
      - ckpool

networks:
  umbrel_main_network:
    external: true
