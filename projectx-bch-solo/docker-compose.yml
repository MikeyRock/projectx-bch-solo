version: "3.8"

services:

  # ──────────────────────────────────────────────
  # nginx — static UI + API reverse proxy
  # ──────────────────────────────────────────────
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./exports/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./exports/app:/usr/share/nginx/html:ro
    depends_on:
      - api

  # ──────────────────────────────────────────────
  # Bitcoin Cash Node
  # ──────────────────────────────────────────────
  bchnd:
    image: bitcoin-cash-node:v28.0.1
    restart: unless-stopped
    command: >
      sh -c "
        SETTINGS=/data/projectx-settings.json
        RPC_USER=\$$(python3 -c \"import json,sys; d=json.load(open('$$SETTINGS')); print(d['rpc']['user'])\" 2>/dev/null || echo bchrpc)
        RPC_PASS=\$$(python3 -c \"import json,sys; d=json.load(open('$$SETTINGS')); print(d['rpc']['pass'])\" 2>/dev/null || echo CHANGE_ME_RPC_PASSWORD)
        exec bitcoind \
          -datadir=/bchnd_data \
          -rpcuser=\$$RPC_USER \
          -rpcpassword=\$$RPC_PASS \
          -rpcallowip=0.0.0.0/0 \
          -rpcbind=0.0.0.0 \
          -rpcport=8332 \
          -server=1 \
          -txindex=1 \
          -addnode=seed.flowee.cash \
          -addnode=seeder.criptolayer.net
      "
    volumes:
      - bchnd_data:/bchnd_data
      - ckpool_data:/data:ro
    environment:
      - BITCOIN_DATA=/bchnd_data

  # ──────────────────────────────────────────────
  # ckpool solo stratum server
  # ──────────────────────────────────────────────
  ckpool:
    image: ghcr.io/getumbrel/docker-ckpool-solo:590fb2a
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - ckpool_data:/data
      - ./scripts/init.sh:/scripts/init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    depends_on:
      - bchnd

  # ──────────────────────────────────────────────
  # Tiny Python Flask API
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ckpool_data:/data
    environment:
      - BCH_RPC_HOST=bchnd
      - BCH_RPC_PORT=8332
      - SETTINGS_FILE=/data/projectx-settings.json
      - LOG_FILE=/data/ckpool.log
    depends_on:
      - bchnd
      - ckpool

volumes:
  bchnd_data:
  ckpool_data:
