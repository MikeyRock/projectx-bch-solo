version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: bchnd
      APP_PORT: 8332
      PROXY_AUTH_ADD: "false"
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init:
    image: alpine:3.19
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/bchnd /data/ckpool/config
        if [ ! -f /data/ckpool/config/ckpool.conf ]; then
          cat > /data/ckpool/config/ckpool.conf << 'CKPOOLEOF'
        {
          "btcd" : [{
            "url" : "bchnd:8332",
            "auth" : "bchrpc",
            "pass" : "changeme",
            "notify" : true
          }],
          "btcaddress" : "CHANGEME_BCH_PAYOUT_ADDRESS",
          "btcsig" : "/mined by ProjectX/",
          "nonce1length" : 4,
          "nonce2length" : 8,
          "update_interval" : 30,
          "version_mask" : "1fffe000"
        }
        CKPOOLEOF
          echo "Created ckpool.conf"
        else
          echo "ckpool.conf already exists"
        fi
    networks:
      - umbrel_main_network

  bchnd:
    image: zquestz/bitcoin-cash-node:28.0.1
    restart: on-failure
    stop_grace_period: 10m
    depends_on:
      init:
        condition: service_completed_successfully
    command: >
      bitcoind
      -datadir=/data
      -rpcuser=bchrpc
      -rpcpassword=changeme
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0
      -rpcport=8332
      -server=1
      -txindex=1
      -addnode=seed.flowee.cash
      -addnode=seeder.criptolayer.net
    volumes:
      - ${APP_DATA_DIR}/data/bchnd:/data
    networks:
      - umbrel_main_network

  ckpool:
    image: ghcr.io/getumbrel/docker-ckpool-solo:590fb2a
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "3333:3333"
    volumes:
      - ${APP_DATA_DIR}/data/ckpool/config:/config:ro
    command: ["--btcsolo", "--config", "/config/ckpool.conf"]
    networks:
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
