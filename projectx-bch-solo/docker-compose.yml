version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: web
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
    networks:
      - umbrel_main_network

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    networks:
      - umbrel_main_network

  bchnd:
    image: zquestz/bitcoin-cash-node:28.0.1
    restart: on-failure
    command: bitcoind -datadir=/data -rpcuser=bchrpc -rpcpassword=changeme -rpcallowip=0.0.0.0/0 -rpcbind=0.0.0.0 -rpcport=8332 -server=1 -txindex=1
    volumes:
      - ${APP_DATA_DIR}/data/bchnd:/data
    networks:
      - umbrel_main_network

  ckpool:
    image: ghcr.io/getumbrel/docker-ckpool-solo:590fb2a
    restart: on-failure
    ports:
      - "3333:3333"
    networks:
      - umbrel_main_network
    depends_on:
      - bchnd

networks:
  umbrel_main_network:
    external: true
