tagline: Solo mine Bitcoin Cash from your Umbrel node
icon: https://raw.githubusercontent.com/MikeyRock/projectx-bch-solo/main/projectx-bch-solo/icon.png
description: >-
  Run a full Bitcoin Cash node alongside a ckpool solo Stratum v1 pool.
  Point your ASIC miners at the stratum URL and solo mine BCH directly
  to your own payout address. No pool fees, full custody.
  The dark dashboard shows live hashrate charts, node sync progress,
  network difficulty tracking, and webhook notifications on block found.
  Miner connection: stratum+tcp://<your-umbrel-ip>:3333
  Set your BCH payout address in the dashboard Settings after install.
