name: "Project X — BCH Solo"
version: "1.0.2"
tagline: Solo mine Bitcoin Cash from your Umbrel node
description: >-
  Project X runs a full Bitcoin Cash node alongside a ckpool solo stratum
  server. Point your ASIC miners at the stratum URL and solo mine BCH directly
  to your own payout address — no pool fees, full custody. The dark premium
  dashboard shows live worker stats, node sync progress, share rates, and
  supports webhook notifications when a block is found.
releaseNotes: >-
  Initial release. Self-contained stack with BCHN v28.0.1, ckpool-solo, and
  a dark premium dashboard with hashrate charts, network difficulty tracking,
  node pruning support, and webhook notifications.
