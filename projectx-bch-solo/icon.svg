  <line x1="120" y1="72" x2="120" y2="82" stroke="#0ac18e" stroke-width="3" stroke-linecap="round"/>
  <line x1="136" y1="72" x2="136" y2="82" stroke="#0ac18e" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="138" x2="120" y2="148" stroke="#0ac18e" stroke-width="3" stroke-linecap="round"/>
  <line x1="136" y1="138" x2="136" y2="148" stroke="#0ac18e" stroke-width="3" stroke-linecap="round"/>
  <!-- "PROJECT X" label -->
  <text x="128" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.85">PROJECT X</text>
  <text x="128" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#0ac18e" opacity="0.6">SOLO MINING</text>
