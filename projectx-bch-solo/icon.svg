      <stop offset="0%" stop-color="#0f1114"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- BCH green circle -->
  <circle cx="128" cy="110" r="52" fill="none" stroke="#0ac18e" stroke-width="4" opacity="0.3"/>
